# docker-compose.test.yml — disposable end-to-end environment.
#
#   docker compose -f docker-compose.test.yml up
#
# What you get:
#   - bastion   : yavik/bastion:latest (the published image), API on :8080, SRT on :9710/udp.
#   - init      : one-shot; waits for the API and bootstraps the admin user.
#   - publisher : ffmpeg streaming a 640x360 testsrc into Bastion as stream "test".
#   - viewer    : ffmpeg subscribing to "test" and dumping bytes to /dev/null (headless).
#
# Verify the publisher is flowing: `docker compose -f docker-compose.test.yml logs -f viewer`
# Verify the dashboard:            http://localhost:8080  (admin / test-admin-password)
# Verify subscriber count:         curl -b cookies.txt http://localhost:8080/api/v1/streams/test
# Scale viewers:                   docker compose -f docker-compose.test.yml up --scale viewer=4

services:
  bastion:
    image: yavik/bastion:latest
    restart: unless-stopped
    ports:
      - "9710:9710/udp"
      - "8080:8080/tcp"
    volumes:
      - bastion-test-data:/data
      - ./test-env/bastion.test.toml:/bastion/bastion.toml:ro
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  init:
    image: alpine:3.20
    depends_on:
      bastion:
        condition: service_healthy
    volumes:
      - ./test-env/init.sh:/init.sh:ro
    environment:
      - BASTION_API=http://bastion:8080
      - BASTION_ADMIN_USERNAME=admin
      - BASTION_ADMIN_PASSWORD=test-admin-password
    entrypoint: ["sh", "-c", "apk add --no-cache curl jq >/dev/null && /init.sh"]
    restart: "no"

  publisher:
    image: linuxserver/ffmpeg:latest
    depends_on:
      bastion:
        condition: service_healthy
    restart: unless-stopped
    # testsrc video + sine audio, encoded as MPEG-TS over SRT in publish mode.
    # -g 60 / -keyint_min 60 forces an IDR every ~2s so viewer recovery is fast.
    command: >-
      -re
      -f lavfi -i testsrc=size=640x360:rate=30
      -re
      -f lavfi -i sine=frequency=440:sample_rate=48000
      -c:v libx264 -preset veryfast -tune zerolatency -g 60 -keyint_min 60 -b:v 800k
      -c:a aac -b:a 96k
      -f mpegts srt://bastion:9710?streamid=#!::m=publish,r=test

  viewer:
    image: linuxserver/ffmpeg:latest
    depends_on:
      - publisher
    restart: unless-stopped
    # Headless byte-consumer: subscribes to the stream and discards output.
    # Behavior is equivalent to ffplay for relay/subscriber-count testing,
    # without needing an X display. For visual playback, run ffplay on the host:
    #   ffplay 'srt://127.0.0.1:9710?streamid=#!::m=request,r=test'
    command: >-
      -i srt://bastion:9710?streamid=#!::m=request,r=test
      -f null -

volumes:
  bastion-test-data:
