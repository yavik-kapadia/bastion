# Bastion SRT Relay Server — Default Configuration

[srt]
# UDP address to listen for SRT connections
listen_addr = ":9710"

# Server-side floor for SRT latency window. The handshake takes the MAX of
# this value and the caller's requested latency, so this is a global FLOOR.
# Keep low for LAN-friendly defaults; per-stream `latency_ms` (in the stream
# config / dashboard) plus the caller's URL `&latency=` query parameter
# can raise it per connection.
latency = "120ms"

# Maximum bandwidth per connection in bytes/sec (-1 = unlimited)
max_bandwidth = -1

# Payload size in bytes (1316 = 7 MPEG-TS packets, standard for SRT)
payload_size = 1316

# Per-subscriber packet channel buffer size (ring-buffer for backpressure)
subscriber_buf_size = 512

# Allow streams that are not pre-configured in the database
allow_unregistered_streams = true

# Cap on the number of distinct streams the relay will track at once.
# 0 = unlimited. Set this in shared deployments to prevent one runaway
# client from creating unbounded stream entries.
max_concurrent_streams = 0

# Default max_subscribers applied to newly-created streams that don't
# specify their own. 0 = no default (use the model's "unlimited" sentinel).
default_max_subscribers = 0

# Host port surfaced to clients in the Quick Start SRT URLs. Set this
# only when you NAT a non-9710 port into the container (e.g. 443 to
# blend with QUIC for firewalls that block arbitrary UDP). 0 = use the
# port from listen_addr (default 9710).
external_port = 0

[api]
# HTTP listen address for REST API and web dashboard
listen_addr = ":8080"

# CORS allowed origin (set to your dashboard domain in production)
cors_origin = "*"

# JWT secret for session tokens (change in production!)
jwt_secret = "changeme-use-a-long-random-secret-in-production"

# AES-256-GCM key for encrypting SRT passphrases at rest (32 hex chars = 16 bytes, or 64 hex chars = 32 bytes)
# Leave empty to disable at-rest encryption (not recommended for production)
encryption_key = ""

# Lifetime of a logged-in session cookie / token.
session_ttl = "24h"

# Login attempt rate limit: N tries per window per IP.
login_rate_limit = 10
login_rate_window = "15m"

# Set true if you want HSTS + Secure cookie even when bastion sits behind
# a TLS-terminating proxy that forwards plain HTTP to the container.
force_https = false

[database]
# Path to SQLite database file
path = "./bastion.db"

[logging]
# Log level: debug, info, warn, error
level = "info"

# Log format: text, json
format = "text"

# How long the event_logs table (dashboard log feed) retains rows.
# 24h is reasonable for most deployments. 0 disables the purge.
event_retention = "24h"

# Minimum slog level to persist to the event_logs table. Empty = same
# as `level`. Set to "info" if you want debug noise in stdout but not in
# the dashboard feed.
event_db_level = ""

# Soft cap on event_logs table size in bytes (0 = unlimited). NOT YET
# WIRED — coming in a follow-up PR with the trim-oldest logic.
max_db_size = 0

[thumbnail]
# Per-stream thumbnail capture. Disable on resource-constrained boxes.
enabled = true

# How long a captured frame is cached before re-grabbing. Lower = fresher
# but more ffmpeg work per stream. For "live preview" feel set to "1s";
# for "snapshot every now and then" set to "10s" or longer.
cache_ttl = "10s"

# Scaled output width in px (height keeps aspect ratio). 480 is dashboard-
# thumbnail sized; 1280 is HD-preview sized at ~4x the bytes.
width = 480

# Output format: "jpeg" (default; widest compatibility) or "webp" (smaller
# files at same visual quality, alpha support, fine in every modern
# browser).
format = "jpeg"

# JPEG quality: 1 (best) – 31 (worst). Only used when format = "jpeg".
jpeg_quality = 5

# WebP quality: 0 (worst) – 100 (best). Only used when format = "webp".
webp_quality = 75

# ffmpeg invocation timeout. Must exceed the encoder's keyframe interval.
timeout = "15s"

[media_info]
# Probe the publisher's stream with ffprobe to surface codec/resolution/
# fps/bitrate on the dashboard. Runs once per publisher session.
# NOTE: kill-switch wiring queued for the follow-up PR.
enabled = true

[dashboard]
# Brand shown in the nav header and footer. Useful for embedding.
brand_name = "Bastion"

# How often the stream detail page re-requests the thumbnail.
thumbnail_refresh_rate = "15s"

[notify]
# POST a JSON event to this URL when a publisher disconnects. Empty = disabled.
# NOT YET WIRED — coming in a follow-up PR.
publisher_disconnect_webhook = ""
